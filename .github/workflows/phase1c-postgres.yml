      - name: Audit evaluation contract facts without assigning answers
        run: |
          python -m unittest -v test_phase1c_evaluation_contract
          python audit_phase1c_evaluation_contract.py --packet-directory /tmp/phase1c_evaluation_packets --index ../evaluation/provisional_packet_index.json > /tmp/phase1c_evaluation_contract_audit.json
          python audit_phase1c_evaluation_contract.py --packet-directory /tmp/phase1c_evaluation_packets --index ../evaluation/provisional_packet_index.json > /tmp/phase1c_evaluation_contract_audit_replay.json
