name: Phase 1C PostgreSQL checks

on:
  push:
    paths:
      - 'phase-1c-data/implementation/**'
      - 'phase-1c-data/design/**'
      - 'phase-1c-data/evaluation/**'
      - 'phase-1c-data/README.md'
      - '.github/workflows/phase1c-postgres.yml'
  pull_request:
    paths:
      - 'phase-1c-data/implementation/**'
      - 'phase-1c-data/design/**'
      - 'phase-1c-data/evaluation/**'
      - 'phase-1c-data/README.md'
      - '.github/workflows/phase1c-postgres.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: phase-1c-data/implementation

permissions:
  contents: read

jobs:
  database-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase1c_ci_only
          POSTGRES_DB: deal_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_desk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: phase1c_ci_only
      PGDATABASE: deal_desk_test
      DATABASE_URL: postgresql://postgres:phase1c_ci_only@localhost:5432/deal_desk_test
    steps:
      - name: Check out project files
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply 24-table schema
        run: psql -X -v ON_ERROR_STOP=1 -f schema.sql
      - name: Check constraints and connected rows
        run: psql -X -v ON_ERROR_STOP=1 -f phase1c_schema_smoke.sql
      - name: Check 14 isolated row scenarios
        run: psql -X -v ON_ERROR_STOP=1 -f phase1c_row_fixtures.sql
      - name: Install read layer dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'PyYAML>=6,<7'
      - name: Check representative and full buildable catalogue master rows
        run: |
          python render_phase1c_master_slice.py --check
          psql -X -v ON_ERROR_STOP=1 -f phase1c_master_slice.sql
          python render_phase1c_master_slice.py --all-buildable --check
          psql -X -v ON_ERROR_STOP=1 -f phase1c_buildable_master.sql
      - name: Check all 156 provisional catalogue products
        run: |
          python -m unittest -v test_render_phase1c_sellable_catalogue
          python render_phase1c_sellable_catalogue.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -c ROLLBACK
      - name: Load five connected provisional deal paths
        run: |
          python -m unittest -v test_phase1c_vertical_pilot.VerticalPilotRenderTests
          python render_phase1c_vertical_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -c ROLLBACK
      - name: Load thirteen connected conflict paths
        run: |
          python -m unittest -v test_phase1c_conflict_pilot.ConflictRenderTests
          python render_phase1c_conflict_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -f phase1c_conflict_pilot.sql -c ROLLBACK
      - name: Load seeded 36-deal development pilot
        run: |
          python -m unittest -v test_phase1c_stress_pilot.StressRenderTests
          python render_phase1c_stress_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -f phase1c_conflict_pilot.sql \
            -f phase1c_stress_pilot.sql -c ROLLBACK
      - name: Load versioned dependency extension after the 36-deal pilot
        run: |
          python render_phase1c_dependency_pilot.py --check
          psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 \
            -f phase1c_buildable_master.sql -f phase1c_sellable_catalogue.sql \
            -f phase1c_vertical_pilot.sql -f phase1c_conflict_pilot.sql \
            -f phase1c_stress_pilot.sql -f phase1c_dependency_pilot.sql -c ROLLBACK
      - name: Validate typed pilot rows and dependency coverage
        run: |
          python -m unittest -v test_validate_phase1c_generated_rows
          python validate_phase1c_generated_rows.py --load-pilot > /tmp/phase1c_row_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/phase1c_row_validation.json').read_text())
          coverage = report['dependency_coverage']
          assert report['counts']['deals'] == 38
          assert report['counts']['products'] == 158
          assert report['supplier_calendar_coverage']['offers_with_typed_calendar'] >= 1
          assert not report['supplier_calendar_coverage']['offers_missing_calendar']
          assert coverage['finding_counts']['pass'] == 1
          assert coverage['finding_counts']['fail'] == 1
          assert not coverage['coverage_gap']
          PY
      - name: Preserve typed row and dependency report
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-row-validation
          path: /tmp/phase1c_row_validation.json
      - name: Validate independent evidence manifest contracts
        run: |
          python -m unittest -v test_validate_phase1c_evidence_manifests
          python - <<'PY'
          import json
          from pathlib import Path
          from validate_phase1c_evidence_manifests import validate_snapshot_manifest
          errors = validate_snapshot_manifest(json.loads(Path('phase1c_pilot_snapshot_manifest.json').read_text()), base_dir=Path('.'), evaluation_at='2026-09-02T00:00:00Z')
          if errors:
              raise SystemExit('; '.join(errors))
          PY
      - name: Validate typed runtime output envelopes
        run: python -m unittest -v test_validate_phase1c_runtime_outputs
      - name: Check candidate proposal and trace boundary
        run: python -m unittest -v test_phase1c_candidate
      - name: Fail closed on missing historical credit and AR snapshots
        run: python -m unittest -v test_phase1c_historical_credit
      - name: Fail closed on missing historical operational snapshots
        run: python -m unittest -v test_phase1c_historical_operational
      - name: Replay provisional daily stock lanes and offers
        run: python -m unittest -v test_render_phase1c_historical_stock_lanes
      - name: Replay independently proved historical inbound receipts
        run: python -m unittest -v test_render_phase1c_historical_inbound
      - name: Replay bounded historical workshop capacity
        run: python -m unittest -v test_render_phase1c_historical_capacity
      - name: Replay full-term historical provider commitments
        run: python -m unittest -v test_render_phase1c_historical_digital
      - name: Check connected workstation stock, inbound and capacity rows
        run: psql -X -v ON_ERROR_STOP=1 -v phase1c_keep_transaction=1 -f phase1c_buildable_master.sql -f phase1c_supply_rows.sql
      - name: Validate calibration relationships before generation
        run: |
          python -m unittest -v test_validate_phase1c_calibration
          python validate_phase1c_calibration.py
      - name: Verify rules cover every schema column
        run: |
          python -m unittest -v test_validate_phase1c_column_rules
          python validate_phase1c_column_rules.py
      - name: Validate controlled vocabularies and JSON contracts
        run: |
          python -m unittest -v test_validate_phase1c_data_contract
          python validate_phase1c_data_contract.py
      - name: Check pilot scenario coverage and evaluation isolation
        run: |
          python -m unittest -v test_validate_phase1c_scenario_matrix
          python validate_phase1c_scenario_matrix.py
      - name: Check separate provisional evaluation authoring examples
        run: |
          python -m unittest -v test_validate_phase1c_evaluation_draft test_phase1c_evaluation_input_sources
          python validate_phase1c_evaluation_draft.py
      - name: Preflight connected pilot rows and SQL constraints
        run: |
          python validate_phase1c_pilot.py
          python -m unittest -v test_validate_phase1c_pilot
      - name: Preflight configured assembly and production capacity
        run: |
          python -m unittest -v test_build_phase1c_portfolio_draft
          python validate_phase1c_bom_portfolio.py phase1c_portfolio_draft.json
          python -m unittest -v test_validate_phase1c_variant_cost_pilot
          python validate_phase1c_variant_cost_pilot.py phase1c_variant_cost_pilot.json
          python validate_phase1c_variant_cost_pilot.py phase1c_build_cost_draft.json
          python -m unittest -v test_validate_phase1c_bom_portfolio
          python -m unittest -v test_audit_phase1c_build_readiness
          python audit_phase1c_build_readiness.py > /tmp/phase1c_build_readiness.json
          python -m unittest -v test_audit_phase1c_price_distribution
          python audit_phase1c_price_distribution.py > /tmp/phase1c_price_distribution.json
          python -m unittest -v test_experiment_phase1c_margin_spread
          python experiment_phase1c_margin_spread.py > /tmp/phase1c_margin_spread_experiment.json
          python -m unittest -v test_validate_phase1c_technical_fit_pilot
          python validate_phase1c_technical_fit_pilot.py
          python -m unittest -v test_validate_phase1c_technical_fit_draft
          python validate_phase1c_technical_fit_draft.py > /tmp/phase1c_technical_fit_draft.json
          python -m unittest -v test_phase1c_component_units
          python -m unittest -v test_phase1c_digital_units
          python -m unittest -v test_phase1c_horizon
          python validate_phase1c_assembly_pilot.py
          python -m unittest -v test_validate_phase1c_assembly_pilot
      - name: Preserve bounded margin sensitivity experiment
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-margin-spread-experiment
          path: /tmp/phase1c_margin_spread_experiment.json
      - name: Preserve provisional price distribution audit
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-price-distribution
          path: /tmp/phase1c_price_distribution.json
      - name: Compare reader results with 14 reference scenarios
        run: python -m unittest -v test_phase1c_reader
      - name: Validate and compile synthetic policy profiles
        run: |
          python -m unittest -v test_phase1c_policy_compiler
          python compile_phase1c_policy.py --output /tmp/phase1c_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/phase1c_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM deal_desk.pricing_rules) <> 33 OR (SELECT count(*) FROM deal_desk.policy_rules) <> 51 OR (SELECT count(*) FROM deal_desk.approval_rules) <> 21 THEN RAISE EXCEPTION 'Incomplete compiled policy rows'; END IF; END \$\$;"
      - name: Import and read 100 provisional generated-test submissions
        run: |
          python render_phase1c_generated_test_batch.py --check
          PHASE1C_BATCH_DIAGNOSTIC=/tmp/phase1c_generated_test_diagnostic.json PHASE1C_CASE_REVIEW=/tmp/phase1c_generated_case_review.json PHASE1C_DEVELOPMENT_EXCLUSIONS=/tmp/phase1c_development_exclusions.json python -m unittest -v test_phase1c_generated_test_batch
          python -m json.tool /tmp/phase1c_generated_test_diagnostic.json
      - name: Preserve provisional 100-case diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-generated-test-diagnostic
          path: /tmp/phase1c_generated_test_diagnostic.json
      - name: Preserve provisional case review observations
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-generated-case-review
          path: /tmp/phase1c_generated_case_review.json
      - name: Preserve development source exclusion registry
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-development-source-exclusions
          path: /tmp/phase1c_development_exclusions.json
      - name: Audit global dependency impact on existing submissions
        run: |
          python -m unittest -v test_audit_phase1c_dependency_scope
          python audit_phase1c_dependency_scope.py --output /tmp/phase1c_dependency_scope.json
      - name: Preserve dependency scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-dependency-scope
          path: /tmp/phase1c_dependency_scope.json
      - name: Diagnose 400 historical baseline decisions
        run: |
          python -m unittest -v test_render_phase1c_historical_service_coverage
          python audit_phase1c_historical_baseline.py --output /tmp/phase1c_historical_baseline.json --exclusion-output /tmp/phase1c_historical_source_exclusions.json
      - name: Preserve source-only historical exclusion registry
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-historical-source-exclusions
          path: /tmp/phase1c_historical_source_exclusions.json
      - name: Preserve provisional historical diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-historical-baseline
          path: /tmp/phase1c_historical_baseline.json
          if-no-files-found: ignore
      - name: Gate the configured portfolio workstation deal
        run: python -m unittest -v test_phase1c_portfolio_deal
      - name: Check bounded scheduled service coverage
        run: python -m unittest -v test_phase1c_service_pilot
      - name: Read five connected generated pilot modes
        run: python -m unittest -v test_phase1c_vertical_pilot.VerticalPilotReaderTests
      - name: Check provisional customer and credit master
        run: python -m unittest -v test_phase1c_customer_master
      - name: Check 400 provisional historical input deals
        run: python -m unittest -v test_phase1c_historical_inputs
      - name: Freeze dated historical credit and AR views
        run: python -m unittest -v test_render_phase1c_historical_credit
      - name: Read thirteen source conflict cases and isolated generated dependency pair
        run: |
          python render_phase1c_dependency_pilot.py
          python -m unittest -v test_phase1c_conflict_pilot.ConflictReaderTests
      - name: Check mixed pilot replay and contention
        run: python -m unittest -v test_phase1c_stress_pilot.StressReaderTests
      - name: Measure pilot decisions and source provenance
        run: python audit_phase1c_pilot_distribution.py --output /tmp/phase1c_pilot_distribution.json
      - name: Preserve pilot diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-pilot-distribution
          path: /tmp/phase1c_pilot_distribution.json
      - name: Test full commercial decisions using compiled rows
        run: python -m unittest -v test_phase1c_policy_decision
      - name: Test deal decision gates against 14 reference runs
        run: python -m unittest -v test_phase1c_deal_decision
      - name: Recheck a proposed partial delivery against PostgreSQL sources
        run: python -m unittest -v test_phase1c_candidate_reader
      - name: Author separate provisional evaluation input packets
        run: |
          python render_phase1c_evaluation_cases.py --check
          createdb deal_desk_evaluation_inputs
          psql -X -v ON_ERROR_STOP=1 -d deal_desk_evaluation_inputs -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -d deal_desk_evaluation_inputs -f /tmp/phase1c_compiled_rules.sql
          EVALUATION_DATABASE_URL=postgresql://postgres:phase1c_ci_only@localhost:5432/deal_desk_evaluation_inputs PHASE1C_EVALUATION_PACKETS=/tmp/phase1c_evaluation_packets PHASE1C_EVALUATION_PACKETS_V1=/tmp/phase1c_evaluation_packets_v1 python -m unittest -v test_phase1c_evaluation_cases
      - name: Preserve provisional evaluation inputs without answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-provisional-evaluation-inputs
          path: /tmp/phase1c_evaluation_packets
          if-no-files-found: error
      - name: Check reviewer-only draft workspace boundary
        run: |
          python -m unittest -v test_phase1c_evaluation_review
          python phase1c_evaluation_review.py --check-template > /tmp/phase1c_review_workspace_validation.json
          python -m json.tool /tmp/phase1c_review_workspace_validation.json
      - name: Preserve review workspace counts without answers
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-review-workspace-validation
          path: /tmp/phase1c_review_workspace_validation.json
          if-no-files-found: error
      - name: Validate separate model review drafts against pinned facts
        run: |
          python phase1c_evaluation_review.py --index ../evaluation/archive/v1/provisional_packet_index.json --review-file ../evaluation/reviews/model_review_draft.json --packet-directory /tmp/phase1c_evaluation_packets_v1 > /tmp/phase1c_model_review_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/phase1c_model_review_validation.json').read_text())
          assert report['errors'] == []
          assert report['complete_draft_cases'] == 36
          assert report['pending_cases'] == 0
          assert report['independently_reviewed_answers'] == 0
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve model-draft validation without accepting answers
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-model-review-validation
          path: /tmp/phase1c_model_review_validation.json
          if-no-files-found: error
      - name: Audit evaluation contract facts without assigning answers
        run: |
          python -m unittest -v test_phase1c_evaluation_contract
          python audit_phase1c_evaluation_contract.py --packet-directory /tmp/phase1c_evaluation_packets --index ../evaluation/provisional_packet_index.json > /tmp/phase1c_evaluation_contract_audit.json
          python audit_phase1c_evaluation_contract.py --packet-directory /tmp/phase1c_evaluation_packets --index ../evaluation/provisional_packet_index.json > /tmp/phase1c_evaluation_contract_audit_replay.json
          cmp /tmp/phase1c_evaluation_contract_audit.json /tmp/phase1c_evaluation_contract_audit_replay.json
          sha256sum /tmp/phase1c_evaluation_contract_audit.json
      - name: Preserve source facts for evaluation contract decisions
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-evaluation-contract-audit
          path: /tmp/phase1c_evaluation_contract_audit.json
          if-no-files-found: error
      - name: Preserve original v1 review sources separately
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-provisional-evaluation-inputs-v1
          path: /tmp/phase1c_evaluation_packets_v1
          if-no-files-found: error
