          python phase1c_evaluation_review.py --index ../evaluation/archive/v1/provisional_packet_index.json --review-file ../evaluation/reviews/model_review_draft.json --packet-directory /tmp/phase1c_evaluation_packets_v1 > /tmp/phase1c_model_review_validation.json
          python - <<'PY'
          import json
