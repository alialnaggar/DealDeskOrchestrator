name: Phase 2 M1 pinned reader, graph and offline Fulfillment checks

on:
  push:
    branches: [phase2-agent-implementation]
    paths:
      - 'phase-2-implementation/backend/**'
      - '.github/workflows/phase2-m1-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2_ci_only
          POSTGRES_DB: deal_desk_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_desk_m1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: phase2_ci_only
      PGDATABASE: deal_desk_m1_test
      DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_test
      CHECKPOINT_DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_checkpoint
      REFERENCE_DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_campaign_reference
      DEALDESK_PHASE1C_CHECKOUT: ${{ github.workspace }}/phase1c-pinned
      PYTHONPATH: phase-2-implementation/backend
    steps:
      - name: Check out Phase 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select pinned Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check out exact Phase 1C draft source separately
        uses: actions/checkout@v6
        with:
          repository: alialnaggar/DealDeskOrchestrator
          ref: 90c0bc8e285ee69262c7db826b786096a77ad004
          path: phase1c-pinned
          persist-credentials: false
      - name: Check out separately observed Phase 1C development snapshot for compatibility only
        uses: actions/checkout@v6
        with:
          repository: alialnaggar/DealDeskOrchestrator
          ref: 963d217991afa78c8273386f83a13e7de3b87cc2
          path: phase1c-development-m19
          persist-credentials: false
      - name: Verify Phase 1C source identity
        run: test "$(git -C phase1c-pinned rev-parse HEAD)" = '90c0bc8e285ee69262c7db826b786096a77ad004'
      - name: Install locked Phase 2 and compatible Phase 1C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r phase-2-implementation/backend/requirements-m1.1.lock
          python -m pip check
      - name: Create a separate disposable checkpoint database
        run: createdb deal_desk_m1_checkpoint
      - name: Create isolated original reference fixture for campaign safety tests
        run: createdb deal_desk_campaign_reference
      - name: Apply pinned Phase 1C schema in disposable test database
        run: psql -X -v ON_ERROR_STOP=1 -f phase1c-pinned/phase-1c-data/implementation/schema.sql
      - name: Apply identical pinned schema to the isolated reference fixture
        run: psql -X -v ON_ERROR_STOP=1 -d deal_desk_campaign_reference -f phase1c-pinned/phase-1c-data/implementation/schema.sql
      - name: Load actual pinned Phase 1C reference rows
        working-directory: phase1c-pinned/phase-1c-data/implementation
        run: python -c 'from test_phase1c_reader import load_fixture_rows; load_fixture_rows()'
      - name: Load original reference rows independently, before synthetic cases
        working-directory: phase1c-pinned/phase-1c-data/implementation
        env:
          PGDATABASE: deal_desk_campaign_reference
        run: python -c 'from test_phase1c_reader import load_fixture_rows; load_fixture_rows()'
      - name: Load the pinned compiled commercial rules
        working-directory: phase1c-pinned/phase-1c-data/implementation
        run: |
          python compile_phase1c_policy.py --output /tmp/phase2_m1_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/phase2_m1_compiled_rules.sql
          psql -X -v ON_ERROR_STOP=1 -d deal_desk_campaign_reference -f /tmp/phase2_m1_compiled_rules.sql
      - name: Run pinned reader, graph, bounded tool, offline AI and PostgreSQL restart tests
        run: python -m unittest discover -s phase-2-implementation/backend/tests -p 'test_*.py' -v
      - name: Compare two Phase 1C contracts without changing the production pin
        run: |
          test "$(git -C phase1c-development-m19 rev-parse HEAD)" = '963d217991afa78c8273386f83a13e7de3b87cc2'
          python -m dealdesk_phase2.compat_m19 \
            --pinned phase1c-pinned --development phase1c-development-m19 \
            --output phase-2-implementation/backend/benchmarks/results/m19-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m19-disposable-compatibility
          path: phase-2-implementation/backend/benchmarks/results/m19-compatibility.json
          if-no-files-found: ignore
          retention-days: 7
