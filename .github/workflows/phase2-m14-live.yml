name: Phase 2 M1.4 opt-in live provider comparison

on:
  # A dispatch-only workflow cannot run until its file exists on the default
  # branch. This Phase 2-only trigger needs a deliberate benchmark branch push.
  push:
    branches: [phase2-m14-live-run]

permissions:
  contents: read

concurrency:
  group: phase2-m14-live
  cancel-in-progress: false

jobs:
  comparison:
    if: vars.M14_FREE_TIER_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2_ci_only
          POSTGRES_DB: deal_desk_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_desk_m1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: phase2_ci_only
      PGDATABASE: deal_desk_m1_test
      DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_test
      CHECKPOINT_DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_checkpoint
      DEALDESK_PHASE1C_CHECKOUT: ${{ github.workspace }}/phase1c-pinned
      PYTHONPATH: phase-2-implementation/backend
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: alialnaggar/DealDeskOrchestrator
          ref: 90c0bc8e285ee69262c7db826b786096a77ad004
          path: phase1c-pinned
          persist-credentials: false
      - name: Verify pin and configured secrets without disclosing values
        run: |
          test "$(git -C phase1c-pinned rev-parse HEAD)" = '90c0bc8e285ee69262c7db826b786096a77ad004'
          test -n "${GROQ_API_KEY:-}"
          test -n "${GEMINI_API_KEY:-}"
      - name: Install locked dependencies and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r phase-2-implementation/backend/requirements-m1.1.lock
          python -m pip check
      - name: Load pinned fixtures in disposable databases
        run: |
          createdb deal_desk_m1_checkpoint
          psql -X -v ON_ERROR_STOP=1 -f phase1c-pinned/phase-1c-data/implementation/schema.sql
          (cd phase1c-pinned/phase-1c-data/implementation && python -c 'from test_phase1c_reader import load_fixture_rows; load_fixture_rows()')
          (cd phase1c-pinned/phase-1c-data/implementation && python compile_phase1c_policy.py --output /tmp/m14_rules.sql)
          psql -X -v ON_ERROR_STOP=1 -f /tmp/m14_rules.sql
      - name: Diagnose model access without printing credentials or raw error bodies
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          targets = (
              ("groq", "https://api.groq.com/openai/v1/models",
               "Authorization", "Bearer " + os.environ["GROQ_API_KEY"], "openai/gpt-oss-120b"),
              ("gemini", "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash",
               "x-goog-api-key", os.environ["GEMINI_API_KEY"], "models/gemini-3.8-flash"),
          )
          for provider, url, header, credential, model in targets:
              request = Request(url, headers={header: credential})
              try:
                  with urlopen(request, timeout=15) as response:
                      data = json.load(response)
                  ids = {x.get("id") for x in data.get("data", [])} if provider == "groq" else {data.get("name")}
                  print(f"{provider} model-access status=200 requested_model_present={model in ids}", flush=True)
              except HTTPError as exc:
                  try:
                      error = json.loads(exc.read(4096)).get("error", {})
                  except (ValueError, UnicodeDecodeError):
                      error = {}
                  if not isinstance(error, dict):
                      error = {}
                  safe = lambda value: value if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9_-]{1,48}", value) else None
                  message = str(error.get("message", "")).lower()
                  hints = [word for word in ("location", "region", "organization", "project", "billing",
                           "permission", "model", "quota", "key", "api", "blocked")
                           if word in message]
                  print(f"{provider} model-access status={exc.code} type={safe(error.get('type'))} "
                        f"code={safe(error.get('code'))} hints={hints}", flush=True)
              except (URLError, TimeoutError, OSError):
                  print(f"{provider} model-access transport_failure", flush=True)
          PY
      - name: Smoke both providers separately
        run: |
          python -m dealdesk_phase2.benchmark_m14 --live --provider groq --offer-repeats 1 --binding-repeats 0 --output phase-2-implementation/backend/benchmarks/results/groq-smoke.json
          python -m dealdesk_phase2.benchmark_m14 --live --provider gemini --offer-repeats 1 --binding-repeats 0 --output phase-2-implementation/backend/benchmarks/results/gemini-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          for provider in ('groq', 'gemini'):
              records = json.loads(Path(f'phase-2-implementation/backend/benchmarks/results/{provider}-smoke.json').read_text())
              if len(records) != 1 or records[0]['execution'] != 'completed':
                  raise SystemExit(f'{provider} smoke did not complete; inspect sanitized result')
          PY
      - name: Paired repeated trials after both smoke checks
        run: |
          python -m dealdesk_phase2.benchmark_m14 --live --provider groq --output phase-2-implementation/backend/benchmarks/results/groq.json
          python -m dealdesk_phase2.benchmark_m14 --live --provider gemini --output phase-2-implementation/backend/benchmarks/results/gemini.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-sanitized-results
          path: phase-2-implementation/backend/benchmarks/results/*.json
          if-no-files-found: ignore
          retention-days: 7
