name: Phase 2 M1.4 opt-in gated Fulfillment smoke

on:
  push:
    branches: [phase2-m14-smoke-run]

permissions:
  contents: read

jobs:
  smoke:
    if: vars.M14_FREE_TIER_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2_ci_only
          POSTGRES_DB: deal_desk_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_desk_m1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: phase2_ci_only
      PGDATABASE: deal_desk_m1_test
      DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_test
      CHECKPOINT_DATABASE_URL: postgresql://postgres:phase2_ci_only@localhost:5432/deal_desk_m1_checkpoint
      DEALDESK_PHASE1C_CHECKOUT: ${{ github.workspace }}/phase1c-pinned
      PYTHONPATH: phase-2-implementation/backend
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: alialnaggar/DealDeskOrchestrator
          ref: 90c0bc8e285ee69262c7db826b786096a77ad004
          path: phase1c-pinned
          persist-credentials: false
      - name: Verify pinned source and secret presence
        run: |
          test "$(git -C phase1c-pinned rev-parse HEAD)" = '90c0bc8e285ee69262c7db826b786096a77ad004'
          test -n "${GROQ_API_KEY:-}"
          test -n "${GEMINI_API_KEY:-}"
      - name: Install locked dependencies and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r phase-2-implementation/backend/requirements-m1.1.lock
          python -m pip check
      - name: Load pinned fixtures in disposable databases
        run: |
          createdb deal_desk_m1_checkpoint
          psql -X -v ON_ERROR_STOP=1 -f phase1c-pinned/phase-1c-data/implementation/schema.sql
          (cd phase1c-pinned/phase-1c-data/implementation && python -c 'from test_phase1c_reader import load_fixture_rows; load_fixture_rows()')
          (cd phase1c-pinned/phase-1c-data/implementation && python compile_phase1c_policy.py --output /tmp/m14_rules.sql)
          psql -X -v ON_ERROR_STOP=1 -f /tmp/m14_rules.sql
      - name: One eligible Groq Fulfillment smoke
        run: |
          python -m dealdesk_phase2.benchmark_m14 --live --provider groq \
            --offer-repeats 1 --binding-repeats 0 \
            --output phase-2-implementation/backend/benchmarks/results/groq-smoke.json
      - name: Gemini generation, JSON and tool probes
        run: |
          python -m dealdesk_phase2.provider_diagnostic --live --provider gemini --require-success \
            --output phase-2-implementation/backend/benchmarks/results/gemini-probes.json
      - name: One eligible Gemini Fulfillment smoke after probe success
        run: |
          python -m dealdesk_phase2.benchmark_m14 --live --provider gemini \
            --offer-repeats 1 --binding-repeats 0 \
            --output phase-2-implementation/backend/benchmarks/results/gemini-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-gated-smoke-results
          path: phase-2-implementation/backend/benchmarks/results/*.json
          if-no-files-found: ignore
          retention-days: 7
